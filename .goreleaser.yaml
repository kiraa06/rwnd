version: 2

project_name: cl

before:
  hooks:
    - go mod tidy

builds:
  - id: cl
    main: ./cmd/cl
    binary: cl
    env: [CGO_ENABLED=0]
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [darwin, linux]
    goarch: [amd64, arm64]

archives:
  - id: cl
    formats: [tar.gz]
    name_template: >-
      cl_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files: [README.md, LICENSE]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

release:
  footer: |
    {{- $repo := .ReleaseURL | trimPrefix "https://github.com/" | splitList "/releases/tag/" | first -}}
    ## Install or update

    ```sh
    curl -fsSLo install.sh https://raw.githubusercontent.com/{{ $repo }}/{{ .Tag }}/install.sh && RWND_REPO={{ $repo }} sh install.sh
    ```
